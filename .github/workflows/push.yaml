name: Build and push
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  maven-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
            ${{ runner.os }}-

      - name: Run maven build
        run: mvn verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/*.jar

  openapi-lint:
    uses: entur/gha-api/.github/workflows/lint.yml@bcd4972699e455cebffe1328cfb47789a75ca588 # v6.11.0
    secrets: inherit
    with:
      path: 'specs/openapi.yaml'
      upload_to_bucket: false

  # validate signs in to Google Cloud, which forks and fork pull requests cannot do
  openapi-validate:
    if: github.repository_owner == 'entur' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: entur/gha-api/.github/workflows/validate.yml@bcd4972699e455cebffe1328cfb47789a75ca588 # v6.11.0
    with:
      path: 'specs/openapi.yaml'

  openapi-publish:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ openapi-lint, openapi-validate ]
    uses: entur/gha-api/.github/workflows/publish.yml@bcd4972699e455cebffe1328cfb47789a75ca588 # v6.11.0
    secrets: inherit
    with:
      path: 'specs/openapi.yaml'

  docker-build:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [maven-verify]
    uses: entur/gha-docker/.github/workflows/build.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    needs: [docker-build]
    uses: entur/gha-docker/.github/workflows/push.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  docker-scan:
    needs: [ docker-build ]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: dev

  helm-deploy-dev:
    needs: [ helm-lint, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/opentripplanner-mcp
      namespace: opentripplanner-mcp

  helm-deploy-tst:
    needs: [ helm-lint, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/opentripplanner-mcp
      namespace: opentripplanner-mcp

  helm-deploy-prd:
    needs: [ helm-lint, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/opentripplanner-mcp
      namespace: opentripplanner-mcp
