    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
      exclude: ["org.entur*", "no.entur*", "org.rutebanken*"]
    commit-message:
