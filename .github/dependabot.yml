  - package-ecosystem: "docker"
    directories: ["/", "/[!.]*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "helm"
    directories: ["/helm/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
      exclude: ["common"]
    commit-message:
