<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Nearby Mobility</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!--ENTUR_TOKENS-->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: var(--font-sizes-medium);
               display: flex; flex-direction: column; height: 100vh; overflow: hidden;
               background: var(--basecolors-frame-default); color: var(--basecolors-text-accent); }
        #map { height: clamp(260px, 55vh, 600px); flex-shrink: 0; position: relative; }
        #card-strip { flex: 1; background: var(--basecolors-frame-tint); display: flex; overflow-x: auto;
                      border-top: var(--border-widths-medium) solid var(--basecolors-stroke-subdued);
                      scrollbar-width: thin;
                      scrollbar-color: var(--basecolors-shape-subdued) var(--basecolors-frame-tint); }
        .mob-card { min-width: 220px; flex-shrink: 0; padding: 12px 14px;
                    border-right: var(--border-widths-small) solid var(--basecolors-stroke-subdued);
                    display: flex; flex-direction: column; gap: 4px; cursor: pointer;
                    transition: background var(--timings-fast); }
        .mob-card:hover { background: var(--basecolors-frame-subdued); }
        .mob-card.active { background: var(--basecolors-frame-subdued);
                           box-shadow: inset var(--border-widths-large) 0 0 0 var(--basecolors-shape-highlight); }
        .mob-card:focus-visible { outline: none; box-shadow: var(--shadows-focus); }
        .mob-card-header { display: flex; align-items: center; gap: 6px; }
        .mob-icon { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
        /* Shared mobility is one brand colour in Linje; stations get a ring to set them apart. */
        .mob-icon.bike,
        .mob-icon.scooter,
        .mob-icon.moped { background: var(--basecolors-shape-mobility-default); }
        .mob-icon.car { background: var(--basecolors-shape-taxi-default); }
        .mob-icon.station { background: var(--basecolors-shape-mobility-default);
                            border: var(--border-widths-medium) solid var(--basecolors-stroke-light); }
        .mob-icon.other { background: var(--basecolors-shape-subdued); }
        .mob-name { font-weight: 700; color: var(--basecolors-text-accent); font-size: var(--font-sizes-small);
                    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mob-distance { color: var(--basecolors-text-subdued); font-size: var(--font-sizes-extra-small); flex-shrink: 0; }
        .mob-operator { color: var(--basecolors-text-subdued); font-size: var(--font-sizes-small); }
        .mob-range { color: var(--basecolors-text-accent); font-size: var(--font-sizes-small); }
        .mob-availability { color: var(--basecolors-text-accent); font-size: var(--font-sizes-small); }
        .mob-rental-link { display: inline-block; margin-top: 4px; font-size: var(--font-sizes-small);
                           color: var(--basecolors-text-highlight); text-decoration: underline; cursor: pointer; }
        .mob-rental-link:focus-visible { outline: none; box-shadow: var(--shadows-focus); }
        .map-overlay { position: absolute; z-index: var(--z-indexes-popover);
                       background: var(--basecolors-frame-elevated); color: var(--basecolors-text-accent);
                       padding: 5px 10px; border-radius: var(--border-radiuses-medium);
                       box-shadow: var(--shadows-card-shadow);
                       font-size: var(--font-sizes-small); pointer-events: none; }
        .status-card { min-width: 220px; padding: 12px 14px; color: var(--basecolors-text-subdued);
                       font-size: var(--font-sizes-small); display: flex; align-items: center; }
        .leaflet-popup-content { min-width: 160px; }

        /* Leaflet renders its own light-themed surfaces; pull them onto the token palette. */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip,
        .leaflet-control-zoom a, .leaflet-control-attribution {
            background: var(--basecolors-frame-elevated); color: var(--basecolors-text-accent);
        }
        .leaflet-control-zoom a { border-color: var(--basecolors-stroke-subdued); }
        .leaflet-control-attribution a { color: var(--basecolors-text-subdued); }
        /* OSM raster tiles have no dark variant; damp them so markers stay readable. */
        :root[data-color-mode="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
        @media (prefers-color-scheme: dark) {
            :root:not([data-color-mode="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="card-strip"><div class="status-card">Waiting for data…</div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.2/dist/src/app-with-deps.js";

        const app = new App({ name: "nearby-mobility", version: "1.0.0" });

        // --- Entur colour mode ------------------------------------------------
        // Linje tokens key off data-color-mode on <html>. With the attribute absent the
        // prefers-color-scheme block in entur-tokens.css decides, so the app is themed
        // correctly before the host has reported anything.
        function applyColorMode(theme) {
            const root = document.documentElement;
            if (theme === 'dark' || theme === 'light') root.setAttribute('data-color-mode', theme);
            else root.removeAttribute('data-color-mode');
        }

        // Leaflet writes colours into SVG presentation attributes, which do not accept
        // var(), so vector layers need the token resolved to a concrete value.
        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        // Leaflet layers bake in resolved colours, so a colour-mode change needs a re-render.
        let lastResult = null;
        function onColorModeChange() {
            if (lastResult) applyToolResult(lastResult);
        }
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onColorModeChange);
        let leafletMap = null;
        let originMarker = null;
        let radiusCircle = null;
        const markers = [];
        let titleOverlay = null;
        let countOverlay = null;

        const i18n = {
            en: {
                title: "Shared mobility",
                no_results: "Nothing found within radius",
                near_subtitle: "Near {0} · {1}m radius",
                vehicles_count: "{0} vehicles",
                stations_count: "{0} stations",
                origin: "Origin",
                range_remaining: "{0} km range",
                available: "{0} available",
                open_in_app: "Open in app",
                parse_error: "Parse error: {0}",
                data_error: "Error: {0}",
                form_factor: {
                    BICYCLE: "Bicycle",
                    CARGO_BICYCLE: "Cargo bike",
                    CAR: "Car",
                    MOPED: "Moped",
                    SCOOTER_STANDING: "E-scooter",
                    SCOOTER_SEATED: "E-scooter",
                    OTHER: "Vehicle",
                },
            },
            nb: {
                title: "Delemobilitet",
                no_results: "Ingen kjøretøy funnet i nærheten",
                near_subtitle: "Nær {0} · {1}m radius",
                vehicles_count: "{0} kjøretøy",
                stations_count: "{0} stasjoner",
                origin: "Opprinnelse",
                range_remaining: "{0} km igjen",
                available: "{0} tilgjengelig",
                open_in_app: "Åpne i app",
                parse_error: "Lesefeil: {0}",
                data_error: "Feil: {0}",
                form_factor: {
                    BICYCLE: "Sykkel",
                    CARGO_BICYCLE: "Lastesykkel",
                    CAR: "Bil",
                    MOPED: "Moped",
                    SCOOTER_STANDING: "Sparkesykkel",
                    SCOOTER_SEATED: "Sparkesykkel",
                    OTHER: "Kjøretøy",
                },
            },
            nn: {
                title: "Delemobilitet",
                no_results: "Ingen køyretøy funne i nærleiken",
                near_subtitle: "Nær {0} · {1}m radius",
                vehicles_count: "{0} køyretøy",
                stations_count: "{0} stasjonar",
                origin: "Opphav",
                range_remaining: "{0} km igjen",
                available: "{0} tilgjengeleg",
                open_in_app: "Opne i app",
                parse_error: "Lesefeil: {0}",
                data_error: "Feil: {0}",
                form_factor: {
                    BICYCLE: "Sykkel",
                    CARGO_BICYCLE: "Lastesykkel",
                    CAR: "Bil",
                    MOPED: "Moped",
                    SCOOTER_STANDING: "Sparkesykkel",
                    SCOOTER_SEATED: "Sparkesykkel",
                    OTHER: "Køyretøy",
                },
            },
        };
        let lang = 'en';
        function t(key, ...args) {
            const parts = key.split('.');
            let s = i18n[lang] || i18n.en;
            for (const p of parts) s = s ? s[p] : undefined;
            if (typeof s !== 'string') s = key;
            args.forEach((v, i) => s = s.replace(`{${i}}`, v));
            return s;
        }

        const cardStripEl = document.getElementById('card-strip');

        function iconClassForFormFactor(ff) {
            if (!ff) return 'other';
            if (ff === 'BICYCLE' || ff === 'CARGO_BICYCLE') return 'bike';
            if (ff === 'SCOOTER_STANDING' || ff === 'SCOOTER_SEATED') return 'scooter';
            if (ff === 'CAR') return 'car';
            if (ff === 'MOPED') return 'moped';
            return 'other';
        }

        // Shared mobility is a single transport colour in Linje, so vehicle classes share it
        // and shape (ring, size) carries the vehicle/station distinction instead.
        const ICON_TOKENS = {
            bike: '--basecolors-shape-mobility-default',
            scooter: '--basecolors-shape-mobility-default',
            moped: '--basecolors-shape-mobility-default',
            station: '--basecolors-shape-mobility-default',
            car: '--basecolors-shape-taxi-default',
            other: '--basecolors-shape-subdued',
        };

        function colorForIcon(cls) {
            return `var(${ICON_TOKENS[cls] || ICON_TOKENS.other})`;
        }

        function resolvedColorForIcon(cls) {
            return cssVar(ICON_TOKENS[cls] || ICON_TOKENS.other);
        }

        function translatedString(ts, fallback) {
            if (!ts || !Array.isArray(ts.translation) || ts.translation.length === 0) return fallback || '';
            const match = ts.translation.find(t => t.language === lang);
            return (match || ts.translation[0]).value || fallback || '';
        }

        function dominantFormFactor(station) {
            const types = station.vehicleTypesAvailable || [];
            if (types.length === 0) return 'OTHER';
            const sorted = [...types].sort((a, b) => (b.count || 0) - (a.count || 0));
            return sorted[0]?.vehicleType?.formFactor || 'OTHER';
        }

        function renderMap(originLat, originLon, originName, radius, vehicles, stations) {
            if (!leafletMap) {
                leafletMap = L.map('map', { zoomControl: false }).setView([originLat, originLon], 15);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                }).addTo(leafletMap);
                L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
            } else {
                leafletMap.setView([originLat, originLon], 15);
            }

            markers.forEach(m => leafletMap.removeLayer(m));
            markers.length = 0;
            if (originMarker) leafletMap.removeLayer(originMarker);
            if (radiusCircle) leafletMap.removeLayer(radiusCircle);

            originMarker = L.circleMarker([originLat, originLon], {
                radius: 7, color: cssVar('--basecolors-shape-highlight'),
                fillColor: cssVar('--basecolors-shape-highlight'), fillOpacity: 1, weight: 2,
            }).bindPopup(t('origin') + ': ' + originName).addTo(leafletMap);
            radiusCircle = L.circle([originLat, originLon], {
                radius, color: cssVar('--basecolors-shape-accent'), weight: 1, dashArray: '4 6', fillOpacity: 0.05,
            }).addTo(leafletMap);

            const bounds = L.latLngBounds([[originLat, originLon]]);

            vehicles.forEach(v => {
                const cls = iconClassForFormFactor(v?.vehicleType?.formFactor);
                const m = L.circleMarker([v.lat, v.lon], {
                    radius: 6, color: resolvedColorForIcon(cls), fillColor: resolvedColorForIcon(cls),
                    fillOpacity: 0.9, weight: 1,
                }).addTo(leafletMap);
                markers.push(m);
                bounds.extend([v.lat, v.lon]);
            });

            stations.forEach(s => {
                const cls = iconClassForFormFactor(dominantFormFactor(s));
                const m = L.circleMarker([s.lat, s.lon], {
                    radius: 9, color: cssVar('--basecolors-stroke-light'), fillColor: resolvedColorForIcon(cls),
                    fillOpacity: 0.95, weight: 2,
                }).addTo(leafletMap);
                markers.push(m);
                bounds.extend([s.lat, s.lon]);
            });

            if (vehicles.length + stations.length > 0) {
                leafletMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
            }

            renderOverlays(originName, radius, vehicles.length, stations.length);
        }

        function renderOverlays(originName, radius, vehicleCount, stationCount) {
            const mapEl = document.getElementById('map');
            if (titleOverlay) titleOverlay.remove();
            if (countOverlay) countOverlay.remove();
            titleOverlay = document.createElement('div');
            titleOverlay.className = 'map-overlay';
            titleOverlay.style.top = '10px';
            titleOverlay.style.left = '10px';
            titleOverlay.textContent = `${t('title')} · ${t('near_subtitle', originName, radius)}`;
            mapEl.appendChild(titleOverlay);

            countOverlay = document.createElement('div');
            countOverlay.className = 'map-overlay';
            countOverlay.style.top = '10px';
            countOverlay.style.right = '10px';
            countOverlay.textContent = `${t('vehicles_count', vehicleCount)} · ${t('stations_count', stationCount)}`;
            mapEl.appendChild(countOverlay);
        }

        function rentalUrl(uris) {
            if (!uris) return null;
            return uris.web || uris.ios || uris.android || null;
        }

        function renderCards(vehicles, stations, systems) {
            systems = systems || {};
            cardStripEl.innerHTML = '';
            const total = vehicles.length + stations.length;
            if (total === 0) {
                const empty = document.createElement('div');
                empty.className = 'status-card';
                empty.textContent = t('no_results');
                cardStripEl.appendChild(empty);
                return;
            }

            const items = [
                ...vehicles.map(v => ({ kind: 'vehicle', data: v })),
                ...stations.map(s => ({ kind: 'station', data: s })),
            ].sort((a, b) => (a.data.distanceMeters || 0) - (b.data.distanceMeters || 0));

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'mob-card';
                if (item.kind === 'vehicle') {
                    const ff = item.data?.vehicleType?.formFactor || 'OTHER';
                    const iconCls = iconClassForFormFactor(ff);
                    const operator = translatedString(systems[item.data?.systemId]?.operator?.name, '');
                    const rangeKm = ((item.data.currentRangeMeters || 0) / 1000).toFixed(1);
                    const url = rentalUrl(item.data.rentalUris);
                    card.innerHTML = `
                        <div class="mob-card-header">
                            <span class="mob-icon ${iconCls}"></span>
                            <span class="mob-name">${t('form_factor.' + ff)}</span>
                            <span class="mob-distance">${item.data.distanceMeters ?? 0}m</span>
                        </div>
                        <div class="mob-operator">${operator}</div>
                        <div class="mob-range">${t('range_remaining', rangeKm)}</div>
                        ${url ? `<a class="mob-rental-link" href="${url}" target="_blank" rel="noopener">${t('open_in_app')}</a>` : ''}
                    `;
                } else {
                    const ff = dominantFormFactor(item.data);
                    const iconCls = 'station';
                    const operator = translatedString(systems[item.data?.systemId]?.operator?.name, '');
                    const name = translatedString(item.data.name, '');
                    const url = rentalUrl(item.data.rentalUris);
                    card.innerHTML = `
                        <div class="mob-card-header">
                            <span class="mob-icon ${iconCls}" style="background:${colorForIcon(iconClassForFormFactor(ff))}; border-color:var(--basecolors-stroke-light);"></span>
                            <span class="mob-name">${name}</span>
                            <span class="mob-distance">${item.data.distanceMeters ?? 0}m</span>
                        </div>
                        <div class="mob-operator">${operator}</div>
                        <div class="mob-availability">${t('available', item.data.numVehiclesAvailable ?? 0)}</div>
                        ${url ? `<a class="mob-rental-link" href="${url}" target="_blank" rel="noopener">${t('open_in_app')}</a>` : ''}
                    `;
                }
                cardStripEl.appendChild(card);
            });
        }

        function showError(msg) {
            cardStripEl.innerHTML = `<div class="status-card">${msg}</div>`;
        }

        // Grafts UI-only fields back onto the payload. The server strips them into
        // _meta["org.entur/ui"] so they never reach the model. Keys are paths where a
        // "[]" suffix means "iterate this list"; values gain one array level per [].
        // Must stay identical across all four app HTML files.
        function graftUiMeta(data, ui) {
            if (!data || !ui) return data;
            for (const path of Object.keys(ui)) {
                applyUiPath(data, path.split("."), ui[path]);
            }
            return data;
        }

        function applyUiPath(node, segs, value) {
            if (node == null || value == null) return;
            const seg = segs[0];
            if (segs.length === 1) { node[seg] = value; return; }
            if (seg.endsWith("[]")) {
                const list = node[seg.slice(0, -2)];
                if (!Array.isArray(list) || !Array.isArray(value)) return;
                list.forEach((item, i) => applyUiPath(item, segs.slice(1), value[i]));
            } else {
                applyUiPath(node[seg], segs.slice(1), value);
            }
        }

        function applyToolResult(result) {
            try {
                const raw = result?.content?.find(c => c.type === "text")?.text;
                if (!raw) return;
                const data = JSON.parse(raw);
                graftUiMeta(data, result?._meta?.["org.entur/ui"]);
                if (data.error) {
                    showError(t('data_error', data.message || data.error));
                    return;
                }
                if (data.language && i18n[data.language]) lang = data.language;
                const q = data.query || {};
                const originLat = Number(q.latitude);
                const originLon = Number(q.longitude);
                const radius = Number(q.radiusMeters) || 500;
                const originName = q.location || '';
                const vehicles = Array.isArray(data.vehicles) ? data.vehicles : [];
                const stations = Array.isArray(data.stations) ? data.stations : [];
                const systems = data.systems || {};

                if (Number.isFinite(originLat) && Number.isFinite(originLon)) {
                    renderMap(originLat, originLon, originName, radius, vehicles, stations);
                }
                renderCards(vehicles, stations, systems);
            } catch (err) {
                showError(t('parse_error', err.message || String(err)));
            }
        }

        app.ontoolresult = (result) => {
            lastResult = result;
            applyToolResult(result);
        };

        app.onhostcontextchanged = (ctx) => {
            if (ctx && 'theme' in ctx) {
                applyColorMode(ctx.theme);
                onColorModeChange();
            }
        };

        await app.connect();
        applyColorMode(app.getHostContext()?.theme);
    </script>
</body>
</html>
