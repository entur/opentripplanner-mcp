<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Nearby Stops</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!--ENTUR_TOKENS-->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: var(--font-sizes-medium);
               display: flex; flex-direction: column; height: 100vh; overflow: hidden;
               background: var(--basecolors-frame-default); color: var(--basecolors-text-accent); }
        #map { height: clamp(200px, 50vh, 320px); flex-shrink: 0; position: relative; }
        #card-strip { flex: 1; background: var(--basecolors-frame-tint); display: flex; overflow-x: auto;
                      border-top: var(--border-widths-medium) solid var(--basecolors-stroke-subdued);
                      scrollbar-width: thin;
                      scrollbar-color: var(--basecolors-shape-subdued) var(--basecolors-frame-tint); }
        .stop-card { min-width: 210px; flex-shrink: 0; padding: 12px 14px;
                     border-right: var(--border-widths-small) solid var(--basecolors-stroke-subdued);
                     display: flex; flex-direction: column; gap: 4px; cursor: pointer;
                     transition: background var(--timings-fast); }
        .stop-card:hover { background: var(--basecolors-frame-subdued); }
        .stop-card.active { background: var(--basecolors-frame-subdued);
                            box-shadow: inset var(--border-widths-large) 0 0 0 var(--basecolors-shape-highlight); }
        .stop-card:focus-visible { outline: none; box-shadow: var(--shadows-focus); }
        .card-stop-name { font-weight: 700; color: var(--basecolors-text-accent); font-size: var(--font-sizes-small);
                          flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-distance { color: var(--basecolors-text-subdued); font-size: var(--font-sizes-extra-small); flex-shrink: 0; }
        .card-modes { display: flex; gap: 3px; flex-wrap: wrap; }
        .mode-badge { display: inline-block; padding: 2px 6px; border-radius: var(--border-radiuses-medium);
                      font-size: var(--font-sizes-extra-small); color: var(--basecolors-frame-default); }
        .departure-row { font-size: var(--font-sizes-small); display: flex; gap: 5px; align-items: center; }
        .departure-row .dest { color: var(--basecolors-text-accent); flex: 1; overflow: hidden;
                               text-overflow: ellipsis; white-space: nowrap; }
        .departure-row .time { color: var(--basecolors-text-accent); flex-shrink: 0; }
        .dep-delay { font-size: var(--font-sizes-extra-small); color: var(--app-feedback-negative-text); }
        .dep-delay.delay-ok { color: var(--app-feedback-success-text); }
        .no-departures { color: var(--basecolors-text-disabled); font-size: var(--font-sizes-small); margin-top: 4px; }
        .map-overlay { position: absolute; z-index: var(--z-indexes-popover);
                       background: var(--basecolors-frame-elevated); color: var(--basecolors-text-accent);
                       padding: 5px 10px; border-radius: var(--border-radiuses-medium);
                       box-shadow: var(--shadows-card-shadow);
                       font-size: var(--font-sizes-small); pointer-events: none; }
        .status-card { min-width: 210px; padding: 12px 14px; color: var(--basecolors-text-subdued);
                       font-size: var(--font-sizes-small); display: flex; align-items: center; }
        .leaflet-popup-content { min-width: 160px; }
        .popup-stop-name { font-weight: 700; font-size: var(--font-sizes-small); }
        .popup-dep { font-size: var(--font-sizes-small); margin-top: 4px; display: flex; gap: 6px; }

        /* Leaflet renders its own light-themed surfaces; pull them onto the token palette. */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip,
        .leaflet-control-zoom a, .leaflet-control-attribution {
            background: var(--basecolors-frame-elevated); color: var(--basecolors-text-accent);
        }
        .leaflet-control-zoom a { border-color: var(--basecolors-stroke-subdued); }
        .leaflet-control-attribution a { color: var(--basecolors-text-subdued); }
        /* OSM raster tiles have no dark variant; damp them so markers stay readable. */
        :root[data-color-mode="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
        @media (prefers-color-scheme: dark) {
            :root:not([data-color-mode="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="card-strip"><div class="status-card">Waiting for data…</div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.2/dist/src/app-with-deps.js";

        const app = new App({ name: "nearby-stops", version: "1.0.0" });

        // --- Entur colour mode ------------------------------------------------
        // Linje tokens key off data-color-mode on <html>. With the attribute absent the
        // prefers-color-scheme block in entur-tokens.css decides, so the app is themed
        // correctly before the host has reported anything.
        function applyColorMode(theme) {
            const root = document.documentElement;
            if (theme === 'dark' || theme === 'light') root.setAttribute('data-color-mode', theme);
            else root.removeAttribute('data-color-mode');
        }

        // Leaflet writes colours into SVG presentation attributes, which do not accept
        // var(), so vector layers need the token resolved to a concrete value.
        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        let lastData = null;
        function onColorModeChange() {
            if (lastData) render(lastData);
        }
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onColorModeChange);
        let leafletMap = null;
        let originMarker = null;
        let radiusCircle = null;
        const stopMarkers = [];
        let titleOverlay = null;
        let countOverlay = null;

        const i18n = {
            en: {
                title:            "Nearby Stops",
                no_stops:         "No stops found within radius",
                stop_found_one:   "stop found",
                stop_found_many:  "stops found",
                usually_on_time:  "Usually on time",
                typically_late:   "Typically {0} min late",
                up_to:            "up to {0} min",
                near_subtitle:    "Near {0} · {1}m radius",
                origin:           "Origin",
                parse_error:      "Parse error: {0}",
                data_error:       "Error: {0}",
                no_departures:    "No departures now",
            },
            nb: {
                title:            "Nærmeste stopp",
                no_stops:         "Ingen stopp funnet i nærheten",
                stop_found_one:   "stopp funnet",
                stop_found_many:  "stopp funnet",
                usually_on_time:  "Vanligvis i rute",
                typically_late:   "Vanligvis {0} min forsinket",
                up_to:            "opptil {0} min",
                near_subtitle:    "Nær {0} · {1}m radius",
                origin:           "Opprinnelse",
                parse_error:      "Lesefeil: {0}",
                data_error:       "Feil: {0}",
                no_departures:    "Ingen avganger nå",
            },
            nn: {
                title:            "Næraste stopp",
                no_stops:         "Ingen stopp funne i nærleiken",
                stop_found_one:   "stopp funne",
                stop_found_many:  "stopp funne",
                usually_on_time:  "Vanlegvis i rute",
                typically_late:   "Vanlegvis {0} min forseinka",
                up_to:            "opptil {0} min",
                near_subtitle:    "Nær {0} · {1}m radius",
                origin:           "Opphav",
                parse_error:      "Lesefeil: {0}",
                data_error:       "Feil: {0}",
                no_departures:    "Ingen avgangar no",
            },
        };
        let lang = 'en';
        function t(key, ...args) {
            let s = (i18n[lang] || i18n.en)[key] || key;
            args.forEach((v, i) => s = s.replace(`{${i}}`, v));
            return s;
        }

        const cardStripEl = document.getElementById('card-strip');

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // OTP transport modes -> Entur Linje transport tokens.
        const MODE_TOKENS = {
            bus: 'bus', coach: 'bus',
            rail: 'train', train: 'train',
            metro: 'metro', subway: 'metro',
            tram: 'tram',
            water: 'ferry', ferry: 'ferry',
            air: 'plane', plane: 'plane',
            funicular: 'funicular', cableway: 'cableway',
            taxi: 'taxi', bicycle: 'bicycle',
            foot: 'walk', walk: 'walk',
        };

        function modeToken(mode) {
            const key = MODE_TOKENS[(mode || '').toLowerCase()];
            return key ? `--basecolors-shape-${key}-default` : '--basecolors-shape-subdued';
        }

        function modeColor(mode) {
            return `var(${modeToken(mode)})`;
        }

        function safeHex(v) {
            return (v && /^[0-9A-Fa-f]{6}$/.test(v)) ? '#' + v : null;
        }

        function lineColor(line) {
            return safeHex(line?.presentation?.colour) || modeColor(line?.transportMode);
        }

        // Transport fills are saturated in light mode and pastel in dark, so the label must
        // invert with the surface. --basecolors-frame-default is white in light mode and
        // near-black in dark; --basecolors-text-light stays pale in both and would vanish.
        function lineTextColor(line) {
            return safeHex(line?.presentation?.textColour) || 'var(--basecolors-frame-default)';
        }

        function parseDurationSecs(dur) {
            if (!dur) return 0;
            const m = dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?/);
            if (!m) return 0;
            return (parseInt(m[1] || 0) * 3600) + (parseInt(m[2] || 0) * 60) + parseFloat(m[3] || 0);
        }

        function formatDelay(empiricalDelay) {
            if (!empiricalDelay) return null;
            const p50 = parseDurationSecs(empiricalDelay.p50);
            const p90 = parseDurationSecs(empiricalDelay.p90);
            if (p50 < 60) return { text: t('usually_on_time'), ok: true };
            const mins = Math.round(p50 / 60);
            const upTo = p90 > p50 + 120 ? `, ${t('up_to', Math.round(p90 / 60))}` : '';
            return { text: t('typically_late', mins) + upTo, ok: false };
        }

        function formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString(lang === 'en' ? 'en-GB' : lang === 'nn' ? 'nn-NO' : 'nb-NO', { hour: '2-digit', minute: '2-digit' });
        }

        function makeStopIcon(modes) {
            const color = modeColor(modes?.[0]);
            const html = `<div style="width:22px;height:22px;border-radius:50%;background:${color};` +
                `border:2px solid var(--basecolors-stroke-light);box-shadow:var(--shadows-card-shadow);"></div>`;
            return L.divIcon({ html, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
        }

        function departureRows(calls) {
            return (calls ?? []).map(c => {
                const line = c.serviceJourney?.line;
                const delay = formatDelay(c.empiricalDelay);
                return `<div class="popup-dep">` +
                    `<span class="line-code" style="background:${lineColor(line)};color:${lineTextColor(line)};padding:1px 5px;border-radius:3px">${esc(line?.publicCode ?? '?')}</span>` +
                    `<span>${esc(c.destinationDisplay?.frontText ?? '')}</span>` +
                    `<span style="margin-left:auto">${formatTime(c.expectedDepartureTime)}${delay ? ` <span class="dep-delay${delay.ok ? ' delay-ok' : ''}">${esc(delay.text)}</span>` : ''}</span>` +
                    `</div>`;
            }).join('');
        }

        function render(data) {
            const edges = data?.nearest?.edges ?? [];
            const q = data?.query ?? {};

            if (!leafletMap) {
                const mapEl0 = document.getElementById('map');
                if (mapEl0._leaflet_id) delete mapEl0._leaflet_id;
                leafletMap = L.map('map', { zoomControl: false }).setView([q.latitude, q.longitude], 15);
                L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(leafletMap);

                const mapEl = document.getElementById('map');

                titleOverlay = document.createElement('div');
                titleOverlay.className = 'map-overlay';
                titleOverlay.style.cssText = 'top:10px;left:10px;max-width:60%;';
                mapEl.appendChild(titleOverlay);

                countOverlay = document.createElement('div');
                countOverlay.className = 'map-overlay';
                countOverlay.style.cssText = 'top:10px;right:10px;';
                mapEl.appendChild(countOverlay);
            }

            const subtitle = q.location
                ? ` &nbsp;·&nbsp; <span style="color:var(--basecolors-text-subdued);font-weight:400">${esc(t('near_subtitle', q.location, q.radiusMeters))}</span>`
                : '';
            if (titleOverlay) {
                titleOverlay.innerHTML = `<strong>${esc(t('title'))}</strong>${subtitle}`;
                countOverlay.textContent = edges.length > 0
                    ? `${edges.length} ${edges.length === 1 ? t('stop_found_one') : t('stop_found_many')}`
                    : t('no_stops');
            }

            stopMarkers.forEach(m => leafletMap.removeLayer(m));
            stopMarkers.length = 0;
            if (originMarker) leafletMap.removeLayer(originMarker);
            if (radiusCircle) leafletMap.removeLayer(radiusCircle);
            cardStripEl.innerHTML = '';

            const highlight = cssVar('--basecolors-shape-highlight');
            const accent = cssVar('--basecolors-shape-accent');
            originMarker = L.circleMarker([q.latitude, q.longitude], {
                radius: 7, color: highlight, fillColor: highlight, fillOpacity: 1, weight: 2
            }).addTo(leafletMap).bindTooltip(esc(q.location || t('origin')), { permanent: false });

            radiusCircle = L.circle([q.latitude, q.longitude], {
                radius: q.radiusMeters,
                color: accent, weight: 1, fillColor: accent, fillOpacity: 0.04
            }).addTo(leafletMap);

            const cardEls = [];

            function setActive(idx) {
                cardEls.forEach((c, i) => c.classList.toggle('active', i === idx));
            }

            edges.forEach(({ node }, idx) => {
                const stop = node?.place;
                if (!stop?.latitude) return;

                const modes = stop.transportMode ?? [];
                const calls = (stop.estimatedCalls ?? []).slice(0, 4);

                const marker = L.marker([stop.latitude, stop.longitude], { icon: makeStopIcon(modes) })
                    .addTo(leafletMap);

                marker.bindPopup(
                    `<div class="popup-stop-name">${esc(stop.name)}</div>` +
                    `<small style="color:var(--basecolors-text-subdued)">${modes.map(esc).join(', ')} · ${Math.round(node.distance)}m</small>` +
                    departureRows(calls)
                );
                stopMarkers.push(marker);

                const modeBadges = modes.map(m =>
                    `<span class="mode-badge" style="background:${modeColor(m)}">${esc(m)}</span>`
                ).join('');

                const depRowsHtml = calls.map(c => {
                    const line = c.serviceJourney?.line;
                    const delay = formatDelay(c.empiricalDelay);
                    const delayHtml = delay
                        ? ` <span class="dep-delay${delay.ok ? ' delay-ok' : ''}">${esc(delay.text)}</span>`
                        : '';
                    return `<div class="departure-row">` +
                        `<span class="mode-badge" style="background:${lineColor(line)};color:${lineTextColor(line)}">${esc(line?.publicCode ?? '?')}</span>` +
                        `<span class="dest">${esc(c.destinationDisplay?.frontText ?? '')}</span>` +
                        `<span class="time">${formatTime(c.expectedDepartureTime)}${delayHtml}</span>` +
                        `</div>`;
                }).join('');

                const card = document.createElement('div');
                card.className = 'stop-card' + (idx === 0 ? ' active' : '');
                card.innerHTML =
                    `<div style="display:flex;align-items:baseline;gap:6px;">` +
                        `<span class="card-stop-name">${esc(stop.name)}</span>` +
                        `<span class="card-distance">${Math.round(node.distance)}m</span>` +
                    `</div>` +
                    `<div class="card-modes">${modeBadges}</div>` +
                    (calls.length > 0 ? depRowsHtml : `<div class="no-departures">${t('no_departures')}</div>`);

                card.addEventListener('click', () => {
                    setActive(idx);
                    leafletMap.panTo([stop.latitude, stop.longitude]);
                    marker.openPopup();
                });

                marker.on('click', () => {
                    setActive(idx);
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                });

                cardEls.push(card);
                cardStripEl.appendChild(card);
            });

            if (edges.length === 0) {
                const placeholder = document.createElement('div');
                placeholder.className = 'status-card';
                placeholder.textContent = t('no_stops');
                cardStripEl.appendChild(placeholder);
            }

            if (edges.length > 0) {
                const group = L.featureGroup([originMarker, ...stopMarkers]);
                leafletMap.fitBounds(group.getBounds(), { padding: [20, 20] });
            }
        }

        // Grafts UI-only fields back onto the payload. The server strips them into
        // _meta["org.entur/ui"] so they never reach the model. Keys are paths where a
        // "[]" suffix means "iterate this list"; values gain one array level per [].
        // Must stay identical across all four app HTML files.
        function graftUiMeta(data, ui) {
            if (!data || !ui) return data;
            for (const path of Object.keys(ui)) {
                applyUiPath(data, path.split("."), ui[path]);
            }
            return data;
        }

        function applyUiPath(node, segs, value) {
            if (node == null || value == null) return;
            const seg = segs[0];
            if (segs.length === 1) { node[seg] = value; return; }
            if (seg.endsWith("[]")) {
                const list = node[seg.slice(0, -2)];
                if (!Array.isArray(list) || !Array.isArray(value)) return;
                list.forEach((item, i) => applyUiPath(item, segs.slice(1), value[i]));
            } else {
                applyUiPath(node[seg], segs.slice(1), value);
            }
        }

        app.ontoolresult = (result) => {
            try {
                const text = result?.content?.find(c => c.type === "text")?.text;
                const data = JSON.parse(text ?? '{}');
                graftUiMeta(data, result?._meta?.["org.entur/ui"]);
                if (data.error) {
                    lang = data.language || lang;
                    cardStripEl.innerHTML = '';
                    const errCard = document.createElement('div');
                    errCard.className = 'status-card';
                    errCard.textContent = t('data_error', data.message || data.error);
                    cardStripEl.appendChild(errCard);
                    return;
                }
                lang = data.language || 'en';
                lastData = data;
                render(data);
            } catch (e) {
                cardStripEl.innerHTML = '';
                const errCard = document.createElement('div');
                errCard.className = 'status-card';
                errCard.textContent = t('parse_error', e.message);
                cardStripEl.appendChild(errCard);
            }
        };

        app.onhostcontextchanged = (ctx) => {
            if (ctx && 'theme' in ctx) {
                applyColorMode(ctx.theme);
                onColorModeChange();
            }
        };

        await app.connect();
        applyColorMode(app.getHostContext()?.theme);
    </script>
</body>
</html>
