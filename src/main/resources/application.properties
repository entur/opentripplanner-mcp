spring.application.name=opentripplanner-mcp
spring.jmx.enabled=false

# cloud-logging's Logback configuration does not default the root level to INFO
logging.level.root=INFO

server.port=8080
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus

# MCP Server Configuration
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.name=entur-journey-planner

org.entur.otp.url=https://api.dev.entur.io/journey-planner/v3/graphql
org.entur.geocoder.url=https://api.dev.entur.io/geocoder/v2/autocomplete
org.entur.mobility.url=https://api.entur.io/mobility/v2/graphql
org.entur.vehicles.ws.url=wss://api.entur.io/realtime/v2/vehicles/subscriptions
# Sent from the user's browser by the trip map, so it is public by design. The server's own
# ET-Client-Name (org.entur.mcp.client_name) comes from Secret Manager in deployed
# environments and falls back to a local-only value here.
org.entur.vehicles.client_name=opentripplanner-mcp-app

# OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.show-actuator=false

# Metrics Configuration
management.metrics.tags.application=${spring.application.name}