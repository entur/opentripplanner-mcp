apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.common.app }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . |trim| nindent 4 }}
data:
    application.properties: |-
      spring.application.name=opentripplanner-mcp
      server.port=8080
      management.server.port=9090
      management.endpoints.web.exposure.include=health,prometheus
      # MCP Server Configuration
      spring.ai.mcp.server.protocol=STATELESS
      spring.ai.mcp.server.capabilities.prompt=false
      spring.ai.mcp.server.capabilities.completion=false
      spring.ai.mcp.server.capabilities.resource=true
      spring.ai.mcp.server.capabilities.tool=true
      spring.ai.mcp.server.name=entur-journey-planner

      # OpenAPI / Swagger UI Configuration
      springdoc.api-docs.path=/api/openapi
      springdoc.show-actuator=false

      # Metrics Configuration
      management.metrics.tags.application=opentripplanner-mcp

      org.entur.otp.url={{ .Values.configmap.urls.otp }}
      org.entur.geocoder.url={{ .Values.configmap.urls.geocoder }}
      org.entur.vehicles.ws.url={{ .Values.configmap.urls.vehiclesWs }}
      org.entur.mobility.url={{ .Values.configmap.urls.mobility }}

      # ET-Client-Name for upstream calls, synced from Secret Manager (common.secrets).
      # No default: a pod without the secret fails at startup instead of calling as someone else.
      org.entur.mcp.client_name=${ET_CLIENT_NAME}
      # Sent from the user's browser by the trip map - public by design, never the secret above.
      org.entur.vehicles.client_name=opentripplanner-mcp-app
